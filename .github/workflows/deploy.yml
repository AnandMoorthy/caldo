name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /caldo/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Point Pages at the Actions build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # mycaldo.xyz used to be this site's custom domain. Publishing from
          # the branch (no CNAME) already moved the URL to anandhere.xyz/caldo,
          # but that publish is the unbuilt source. Ask Pages to keep using the
          # Actions artifact and to leave the custom domain empty.
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          auth=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          put_pages() {
            local payload="$1"
            local code
            code="$(curl -sS -o pages.json -w "%{http_code}" -X PUT "${auth[@]}" "$api" -d "$payload" || true)"
            echo "PUT ${payload} -> HTTP ${code}"
            cat pages.json || true
            echo
            printf '%s' "$code" > pages.status
          }
          put_pages '{"build_type":"workflow","cname":null}'
          code="$(cat pages.status)"
          if [ "$code" -ge 400 ]; then
            put_pages '{"build_type":"workflow","cname":""}'
            code="$(cat pages.status)"
          fi
          if [ "$code" -ge 400 ]; then
            echo "::warning title=Pages settings were not updated::HTTP ${code} $(cat pages.json)"
          fi

      - name: Wait for the branch publish to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push also starts GitHub's Jekyll "pages build and deployment"
          # workflow. If it finishes last, it replaces the built app with the
          # source index.html. Wait it out, then publish the Vite artifact.
          for i in $(seq 1 30); do
            running="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=dynamic&per_page=5" \
              | python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs",[]); print(sum(r["status"] in ("queued","in_progress","waiting") for r in runs))')"
            echo "dynamic pages runs still going: ${running}"
            if [ "$running" = "0" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::A branch Pages build was still running; deploying anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


